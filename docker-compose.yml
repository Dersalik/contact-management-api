version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: contact-api-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=contactdb
    networks:
      - contact-network

  mongo-express:
    image: mongo-express:latest
    container_name: contact-api-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
    depends_on:
      - mongodb
    networks:
      - contact-network

  # Uncomment to run the api in docker
  api:
    build: .
    container_name: contact-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_HOST=mongodb
    depends_on:
      - mongodb
    networks:
      - contact-networ

networks:
  contact-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local