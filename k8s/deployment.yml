apiVersion: apps/v1
kind: Deployment
metadata:
  name: contact-management-api
  labels:
    app: contact-management-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contact-management-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: contact-management-api
    spec:
      containers:
        - name: api
          # This is a placeholder that will be replaced during deployment
          image: ${DOCKER_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATA_MONGODB_HOST
              value: mongodb
            - name: SPRING_DATA_MONGODB_PORT
              value: "27017"
            - name: SPRING_DATA_MONGODB_DATABASE
              value: contactdb
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: contact-api-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: contact-management-api
spec:
  selector:
    app: contact-management-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contact-management-api-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: api.contacts.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: contact-management-api
                port:
                  number: 80
  tls:
    - hosts:
        - api.contacts.example.com
      secretName: contacts-tls-secret